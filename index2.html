<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 12 Math Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --mist:#eef5f1; --ghaf:#00684a; --ghaf-ink:#ffffff; --ink:#14231e; --soft:#4d625a;
  --gold:#a8771e; --gold-bg:#f8efdc; --red:#c8102e; --red-bg:#fbe9ec; --ok-bg:#e3f3ea; --line:#d5e2db;
  --shadow:0 1px 0 rgba(20,35,30,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0f1915; --mist:#16241e; --ghaf:#3fbf8f; --ghaf-ink:#0b1410; --ink:#e7f1ec; --soft:#a3b8ae;
  --gold:#e2b556; --gold-bg:#2c2414; --red:#ff6b7d; --red-bg:#3a1a20; --ok-bg:#15352a; --line:#2a3d35; }}
:root[data-theme="dark"]{ --paper:#0f1915; --mist:#16241e; --ghaf:#3fbf8f; --ghaf-ink:#0b1410; --ink:#e7f1ec; --soft:#a3b8ae; --gold:#e2b556; --gold-bg:#2c2414; --red:#ff6b7d; --red-bg:#3a1a20; --ok-bg:#15352a; --line:#2a3d35; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font:400 17px/1.6 "Readex Pro", "Segoe UI", Tahoma, sans-serif; -webkit-font-smoothing:antialiased; }
a{ color:var(--ghaf); }
img{ max-width:100%; }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; border-radius:6px; }
h1,h2,h3{ line-height:1.2; margin:0 0 .5em; font-weight:600; }
h1.pg{ font-size:clamp(1.7rem,4.5vw,2.4rem); letter-spacing:-.01em; }
h2{ font-size:1.3rem; } h3{ font-size:1.08rem; }
p{ margin:0 0 .8em; }
.muted{ color:var(--soft); } .small{ font-size:.88rem; }
.lead{ font-size:1.08rem; color:var(--soft); max-width:62ch; }
.kicker{ color:var(--gold); font-weight:500; font-size:.92rem; margin-bottom:.4em; }

/* header */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:12px; max-width:1100px; margin:0 auto; padding:10px 18px 6px; }
.brand img{ width:46px; height:46px; border-radius:50%; background:#fff; border:2px solid var(--gold); }
.brand .bname{ flex:1; min-width:0; }
.brand b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand b{ display:block; font-size:1rem; font-weight:600; }
.brand small{ display:block; color:var(--soft); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip{ font:inherit; font-size:.85rem; border:1px solid var(--line); background:var(--mist); color:var(--ink); border-radius:999px; padding:6px 12px; cursor:pointer; max-width:46vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav{ display:flex; gap:4px; max-width:1100px; margin:0 auto; padding:0 12px; overflow-x:auto; scrollbar-width:none; }
.nav a{ text-decoration:none; color:var(--soft); padding:10px 12px 12px; font-weight:500; white-space:nowrap; border-bottom:3px solid transparent; }
.nav a.on{ color:var(--ink); border-bottom-color:var(--ghaf); }
main{ max-width:1100px; margin:0 auto; padding:26px 18px 60px; }
footer{ border-top:1px solid var(--line); color:var(--soft); font-size:.82rem; text-align:center; padding:20px 18px 30px; }

/* buttons */
.btns{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; align-items:center; }
.btn{ display:inline-flex; align-items:center; justify-content:center; font:inherit; font-weight:500; border:2px solid var(--ghaf); background:var(--ghaf); color:var(--ghaf-ink); text-decoration:none; border-radius:12px; padding:10px 18px; cursor:pointer; min-height:46px; }
.btn.ghost{ background:transparent; color:var(--ghaf); }
.btn.gold{ background:var(--gold); border-color:var(--gold); color:#fff; }
.btn.small{ min-height:38px; padding:6px 12px; font-size:.9rem; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.back{ display:inline-block; margin-bottom:12px; text-decoration:none; font-weight:500; }
.back::before{ content:"‹ "; }

/* home */
.hero{ display:grid; grid-template-columns:1fr 1.15fr; gap:28px; align-items:center; padding:8px 0 22px; }
.hero h1{ font-size:clamp(2rem,5.5vw,3.2rem); font-weight:700; letter-spacing:-.02em; }
.hero-arch{ background:var(--mist); border-radius:24px; padding:16px 14px 8px; }
.arch{ width:100%; height:auto; display:block; }
.arch .axis{ stroke:var(--soft); stroke-width:1.5; }
.arch .sym{ stroke:var(--gold); stroke-width:1.2; stroke-dasharray:4 5; }
.arch .curve{ fill:none; stroke:var(--ghaf); stroke-width:5; stroke-linecap:round; stroke-dasharray:900; stroke-dashoffset:900; animation:draw 1.4s .2s ease-out forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
.arch .node{ fill:var(--paper); stroke:var(--ghaf); stroke-width:3; }
.arch .node.extra{ stroke:var(--gold); }
.arch .node.done{ fill:var(--ghaf); }
.arch .nlab{ font-size:11px; font-weight:600; text-anchor:middle; fill:var(--ink); pointer-events:none; }
.arch a:hover .node{ stroke-width:5; }
.cap{ font-size:.82rem; color:var(--soft); margin:6px 6px 4px; }
.stats{ display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 26px; }
.stats div{ flex:1 1 140px; border-left:4px solid var(--ghaf); padding:2px 14px; }
.stats b{ display:block; font-size:1.7rem; font-weight:700; }
.stats span{ color:var(--soft); font-size:.9rem; }
.grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.tile{ display:block; text-decoration:none; color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:18px; border-top:5px solid var(--ghaf); }
.tile:nth-child(2){ border-top-color:var(--gold); } .tile:nth-child(3){ border-top-color:var(--red); } .tile:nth-child(4){ border-top-color:var(--ink); }
.tile p{ color:var(--soft); font-size:.94rem; margin:0; }
.note{ margin-top:26px; background:var(--gold-bg); border-radius:16px; padding:18px 20px; }
.note p{ margin:0; max-width:75ch; }

/* lists */
.unit{ margin:24px 0; }
.lessons{ list-style:none; padding:0; margin:12px 0; border-top:1px solid var(--line); }
.lessons a{ display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink); }
.lessons a:hover{ background:var(--mist); }
.code{ font-weight:600; color:var(--ghaf); min-width:2.6em; }
.lessons .t{ flex:1; }
.tag{ font-size:.75rem; padding:2px 9px; border-radius:999px; white-space:nowrap; }
.tag.gold{ background:var(--gold-bg); color:var(--gold); } .tag.ok{ background:var(--ok-bg); color:var(--ghaf); }
.best{ font-weight:600; color:var(--ghaf); }
.exam{ display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink); background:var(--mist); border-radius:16px; padding:16px 18px; margin-top:14px; }
.exam div{ flex:1; } .exam p{ margin:0; color:var(--soft); font-size:.94rem; } .exam h3{ margin:0 0 4px; }
.exam.final{ background:var(--gold-bg); margin:26px 0 10px; }
.soon{ margin-top:18px; font-size:.9rem; }

/* lesson */
.lhead{ margin-bottom:10px; }
.goal{ font-size:1.08rem; max-width:65ch; }
.block{ margin:28px 0; }
.ideas{ padding-left:1.2em; max-width:70ch; } .ideas li{ margin:.45em 0; }
.terms{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:0; }
.terms div{ background:var(--mist); border-radius:12px; padding:12px 14px; }
.terms dt{ font-weight:600; } .terms dd{ margin:0; color:var(--soft); font-size:.94rem; }
.ex{ border:1px solid var(--line); border-radius:14px; margin:10px 0; padding:0 16px; }
.ex summary{ cursor:pointer; padding:14px 0; font-weight:500; }
.exn{ color:var(--gold); margin-right:6px; }
.ex ol{ margin:0 0 14px; padding-left:1.3em; } .ex li{ margin:.3em 0; }
.vid{ position:relative; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000; }
.vid iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.sticky-actions{ border-top:1px solid var(--line); padding-top:16px; }

/* class */
.tabs{ display:flex; gap:6px; overflow-x:auto; margin:10px 0 18px; scrollbar-width:none; }
.tabs a{ white-space:nowrap; text-decoration:none; color:var(--ink); background:var(--mist); border-radius:999px; padding:8px 14px; font-size:.92rem; }
.tabs a.on{ background:var(--ghaf); color:var(--ghaf-ink); }
.panel{ border:1px solid var(--line); border-radius:18px; padding:20px; }
.rw{ border-left:4px solid var(--gold); padding:4px 0 4px 14px; margin:16px 0; }
.rw summary{ cursor:pointer; color:var(--ghaf); font-weight:500; }
.ws-head{ display:flex; gap:14px; align-items:center; border-bottom:2px solid var(--ghaf); padding-bottom:10px; margin-bottom:10px; font-size:.92rem; }
.ws-head img{ width:62px; height:62px; border-radius:50%; }
.wsq li{ margin:12px 0; } .wsq .space{ height:70px; border-bottom:1px dashed var(--line); }
.ans{ color:var(--ghaf); font-weight:500; }

/* lab */
.lab{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; margin-top:10px; }
#labSvg{ width:100%; height:auto; background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
#labSvg .g{ stroke:var(--line); stroke-width:.6; } #labSvg .g.ax{ stroke:var(--soft); stroke-width:1.4; }
#labSvg .pc{ fill:none; stroke:var(--ghaf); stroke-width:3; }
#labSvg .symd{ stroke:var(--gold); stroke-dasharray:4 4; stroke-width:1.4; }
#labSvg .vx{ fill:var(--gold); } #labSvg .root{ fill:var(--red); }
.lab-ctrl label{ display:block; font-weight:600; margin:6px 0; }
.lab-ctrl input[type=range]{ width:100%; accent-color:var(--ghaf); height:30px; }
.eq{ font-size:1.25rem; font-weight:600; color:var(--ghaf); }
.labout{ display:grid; grid-template-columns:1fr; gap:6px; margin:10px 0 0; font-size:.92rem; }
.labout div{ display:flex; gap:10px; border-bottom:1px solid var(--line); padding:4px 0; } .labout dt{ min-width:9.5em; color:var(--soft); } .labout dd{ margin:0; font-weight:500; }

/* sort */
.sort{ display:grid; gap:10px; margin:12px 0; }
.sitem{ border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.sitem.right{ background:var(--ok-bg); border-color:var(--ghaf); }
.st{ font-weight:600; margin-bottom:8px; }
.sopts{ display:flex; flex-wrap:wrap; gap:8px; }
.sopts button{ font:inherit; font-size:.9rem; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:10px; padding:7px 12px; cursor:pointer; min-height:40px; }
.sopts button.yes{ background:var(--ghaf); color:var(--ghaf-ink); border-color:var(--ghaf); }
.sopts button.no{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
.sscore{ font-weight:600; }

/* quiz */
.quiz{ max-width:720px; }
.prog{ height:8px; background:var(--mist); border-radius:9px; overflow:hidden; margin:8px 0; }
.prog span{ display:block; height:100%; background:var(--ghaf); transition:width .3s; }
.qtext{ font-size:1.35rem; font-weight:500; margin:14px 0 18px; }
.opts{ display:grid; gap:10px; }
.opt{ text-align:left; font:inherit; font-size:1.05rem; padding:14px 16px; border:2px solid var(--line); background:var(--paper); color:var(--ink); border-radius:14px; cursor:pointer; min-height:54px; }
.opt.sel{ border-color:var(--ghaf); background:var(--mist); }
.opt.yes{ border-color:var(--ghaf); background:var(--ok-bg); } .opt.no{ border-color:var(--red); background:var(--red-bg); }
.opt:disabled{ cursor:default; color:var(--ink); }
.fb{ margin-top:14px; padding:12px 14px; border-radius:12px; } .fb.good{ background:var(--ok-bg); } .fb.bad{ background:var(--red-bg); }
.qnav{ margin-top:20px; }

/* result */
.result{ max-width:820px; }
.score{ display:flex; align-items:center; gap:18px; margin:6px 0 10px; }
.score .ring{ width:104px; height:104px; }
.score b{ display:block; font-size:2.2rem; font-weight:700; line-height:1; } .score span{ color:var(--soft); }
.fbtext{ font-size:1.1rem; max-width:65ch; background:var(--mist); border-radius:14px; padding:14px 16px; }
.support{ display:grid; gap:12px; } .support article{ border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:12px; padding:14px; }
.support .btns{ margin:6px 0 0; }
.bars{ display:grid; gap:8px; } .bar{ display:flex; align-items:center; gap:10px; }
.bl{ width:2.8em; font-weight:600; } .btr{ flex:1; height:12px; background:var(--mist); border-radius:9px; overflow:hidden; } .btr i{ display:block; height:100%; } .btr i.ok{ background:var(--ghaf); } .btr i.lo{ background:var(--red); } .bv{ width:3em; text-align:right; }
.review{ padding-left:1.2em; } .review li{ margin:12px 0; padding-left:6px; } .review li p{ margin:.2em 0; } .review li.lo{ border-left:3px solid var(--red); } .review li.ok{ border-left:3px solid var(--ghaf); }
.hist{ list-style:none; padding:0; border-top:1px solid var(--line); }
.hist a{ display:flex; gap:12px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink); flex-wrap:wrap; }
.hist .t{ flex:1 1 240px; }
.pill{ font-weight:600; padding:2px 10px; border-radius:999px; background:var(--mist); }
.pill.pass{ background:var(--ok-bg); color:var(--ghaf); } .pill.fail{ background:var(--red-bg); color:var(--red); } .pill.almost{ background:var(--gold-bg); color:var(--gold); }
.certs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
.certcard{ display:block; text-decoration:none; color:var(--ink); background:var(--gold-bg); border-radius:14px; padding:14px 16px; border:1px solid var(--gold); }
.certcard span{ display:block; color:var(--soft); font-size:.88rem; }

/* certificate (always light) */
.cert{ position:relative; display:flex; background:#fffdf8; color:#14231e; border:3px solid #a8771e; border-radius:6px; overflow:hidden; aspect-ratio:1.414/1; max-width:1000px; margin:10px auto; }
.flag{ display:flex; width:7%; flex:none; } .flag i{ width:30%; background:#c8102e; } .flag span{ flex:1; display:flex; flex-direction:column; } .flag b{ flex:1; } .flag b:nth-child(1){ background:#00732f; } .flag b:nth-child(2){ background:#fff; } .flag b:nth-child(3){ background:#000; }
.cert-in{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:3% 5%; outline:1px solid #e3d3ad; outline-offset:-14px; }
.clogo{ width:clamp(60px,13%,130px); border-radius:50%; }
.cschool{ font-weight:600; color:#00684a; margin:.4em 0 .2em; font-size:clamp(.8rem,2vw,1.15rem); }
.cert h1{ font-size:clamp(1.2rem,4.4vw,2.6rem); font-weight:700; color:#a8771e; margin:.1em 0 .3em; }
.cfor{ font-size:clamp(.75rem,1.7vw,1rem); margin:0; color:#4d625a; }
.cname{ font-size:clamp(1.4rem,5vw,3rem); font-weight:600; margin:.1em 0 0; border-bottom:2px solid #a8771e; padding:0 .6em; }
.cgrade{ font-size:clamp(.75rem,1.7vw,1rem); color:#4d625a; margin:.3em 0; }
.cwhy{ font-size:clamp(.78rem,1.9vw,1.1rem); max-width:44em; margin:.3em 0 .8em; }
.csign{ display:flex; justify-content:space-between; align-items:flex-end; width:100%; gap:4%; font-size:clamp(.62rem,1.5vw,.92rem); }
.csign div{ display:flex; flex-direction:column; align-items:center; flex:1; } .csign small{ color:#4d625a; }
.sl{ display:block; width:80%; border-bottom:1px solid #14231e; height:2.2em; margin-bottom:4px; }

/* dialog */
dialog{ border:0; border-radius:20px; padding:0; width:min(440px,92vw); background:var(--paper); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop{ background:rgba(10,20,16,.5); }
.dlg-body{ padding:22px; }
.dlg-body label{ display:block; font-weight:500; margin:10px 0; }
.dlg-body input,.dlg-body select{ display:block; width:100%; font:inherit; padding:10px 12px; margin-top:4px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }


/* math */
.mx{ font-family:"STIX Two Text","Cambria Math","Times New Roman",serif; font-size:1.12em; white-space:nowrap; letter-spacing:.01em; }
.mx i{ font-style:italic; padding:0 .03em; }
.mx sup{ font-size:.68em; line-height:0; vertical-align:.62em; margin-left:.04em; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 .12em; font-size:.92em; line-height:1.15; }
.fr .nu{ border-bottom:1px solid currentColor; padding:0 .2em .05em; } .fr .de{ padding:.05em .2em 0; }
.rad{ display:inline-flex; align-items:flex-start; } .rs{ font-size:1.05em; } .ri{ border-top:1px solid currentColor; padding:0 .12em; margin-top:.18em; line-height:1.2; }
.ideas li .mx, p .mx{ line-height:1.5; }
/* graphs */
.graph{ width:100%; height:auto; display:block; background:var(--paper); border:1px solid var(--line); border-radius:14px; }
.graph .gl{ stroke:var(--line); stroke-width:.6; } .graph .ga{ stroke:var(--soft); stroke-width:1.3; }
.graph .gt{ font:10px "Readex Pro",sans-serif; fill:var(--soft); }
.graph .gc{ fill:none; stroke:var(--ghaf); stroke-width:3; stroke-linecap:round; }
.graph .gline{ stroke:var(--gold); stroke-width:2.5; }
.graph .gsym{ stroke:var(--gold); stroke-width:1.4; stroke-dasharray:5 4; }
.graph .gv{ fill:var(--gold); } .graph .gp{ fill:var(--red); }
.graph .gl2{ font:600 11px "Readex Pro",sans-serif; fill:var(--ink); paint-order:stroke; stroke:var(--paper); stroke-width:3px; }
.graph .gsh{ fill:var(--ghaf); opacity:.16; } .graph .gseg{ stroke:var(--ghaf); stroke-width:6; opacity:.85; }
.graph .gopen{ fill:var(--paper); stroke:var(--ghaf); stroke-width:2.5; }
.graph.small{ max-width:260px; }
.tiles .t1{ fill:var(--ok-bg); stroke:var(--ghaf); stroke-width:2; } .tiles .t2{ fill:var(--mist); stroke:var(--ghaf); stroke-width:2; } .tiles .t3{ fill:var(--gold-bg); stroke:var(--gold); stroke-width:2; stroke-dasharray:6 4; }
.tiles .tt{ font:italic 600 18px "STIX Two Text",serif; text-anchor:middle; fill:var(--ink); } .tiles .tt.gold{ fill:var(--gold); font-style:normal; } .tiles .ts{ font:italic 14px "STIX Two Text",serif; text-anchor:middle; fill:var(--soft); }
.cyc{ fill:none; stroke:var(--line); stroke-width:3; } .cyn{ fill:var(--mist); stroke:var(--ghaf); stroke-width:2; } .cyt{ font:italic 600 18px "STIX Two Text",serif; text-anchor:middle; fill:var(--ghaf); } .cys{ font:11px "Readex Pro",sans-serif; text-anchor:middle; fill:var(--soft); }
.vis{ margin:0; } .vis figcaption{ font-size:.9rem; color:var(--soft); margin-top:6px; }
.ideas-wrap{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px; align-items:start; }
.visuals{ display:grid; gap:12px; } .visuals.n3{ grid-template-columns:repeat(3,1fr); } .visuals.n3 .vis figcaption{ font-size:.8rem; }
.ideas-wrap:has(.visuals.n3){ grid-template-columns:1fr; }
.exb{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,300px); gap:16px; align-items:start; padding-bottom:14px; } .exb ol{ margin:0; }
.qg{ max-width:340px; margin:0 0 16px; }
/* videos */
.vids{ display:grid; gap:12px; }
.vcard{ display:flex; gap:14px; align-items:center; text-decoration:none; color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.vcard:hover{ background:var(--mist); } .vcard small{ display:block; color:var(--soft); }
.play{ width:44px; height:44px; flex:none; border-radius:50%; background:var(--ghaf); color:var(--ghaf-ink); display:grid; place-items:center; font-size:1.1rem; }
/* hero sky */
.sky{ position:relative; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:20px; align-items:center; margin:-8px -6px 24px; padding:26px 26px 22px; border-radius:26px; color:#eef7f3; background:radial-gradient(120% 90% at 80% 0%, #1d4a5c 0%, #0d2a2c 45%, #071615 100%); overflow:hidden; }
.sky h1{ font-size:clamp(2rem,5vw,3rem); font-weight:700; letter-spacing:-.02em; color:#fff; }
.sky p{ color:#cfe3da; max-width:46ch; }

    $$(".sname").forEach((b) => b.onclick = () => { TD.f.q = b.dataset.n; re(); });
    if ($("#tMore")) $("#tMore").onclick = () => { TD.more = true; re(); };
    if ($("#tRefresh")) $("#tRefresh").onclick = () => loadRows(ses.get("tkey"));
    $("#tOut").onclick = () => { if (!TD.demo) ses.set("tkey", null); TD = null; route(); };
    $("#tCsv").onclick = () => {
      const cols = ["date", "name", "grade", "section", "type", "task", "correct", "total", "percent", "result", "certificate", "weakLessons", "feedback", "wrongQuestions"];
      const csv = [cols.join(",")].concat(filtered().map((r) => cols.map((c) => `"${String(r[c] == null ? "" : r[c]).replace(/"/g, '""')}"`).join(","))).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" })); a.download = "math-hub-results.csv"; document.body.appendChild(a); a.click(); a.remove();
    };
  }
  function demoRows() {
    const names = ["Mahra Al Ketbi", "Shamma Al Nuaimi", "Hessa Al Mazrouei", "Maryam Al Hammadi", "Fatima Al Dhaheri", "Noura Al Shamsi", "Alyazia Al Mansoori", "Reem Al Ameri", "Latifa Al Suwaidi", "Moza Al Kaabi", "Aisha Al Hosani", "Salama Al Falasi"];
    const out = [], core = coreLessons(); let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    names.forEach((n, i) => { const cls = "12-" + ((i % 3) + 1), skill = 0.45 + rnd() * 0.5;
      core.forEach((l, k) => { if (rnd() < 0.85) { const hard = l.code === "1-7" || l.code === "1-5" ? 0.2 : 0; const pc = Math.max(0, Math.min(100, Math.round((skill - hard + (rnd() - 0.5) * 0.3) * 5) * 20)); const res = pc >= P() ? "pass" : pc >= SETTINGS.almostMark ? "almost" : "fail";
        out.push({ date: new Date(Date.now() - (30 - k * 3) * 864e5 - rnd() * 864e5).toISOString(), name: n, grade: "12", section: cls, type: "post", task: `Lesson ${l.code} post-assessment: ${l.title}`, correct: pc / 20, total: 5, percent: pc, result: res, certificate: res === "pass" ? "Lesson badge" : "", weakLessons: res === "pass" ? "" : `${l.code} ${l.title} (${pc}%)`, feedback: res === "pass" ? `Excellent work! You scored ${pc}% and passed.` : `Good effort. You scored ${pc}%. Start with Lesson ${l.code} ${l.title}, then try again.`, wrongQuestions: "" }); } });
      if (rnd() < 0.7) { const pc = Math.round((skill + (rnd() - 0.4) * 0.2) * 18) / 18 * 100 | 0; out.push({ date: new Date(Date.now() - 2 * 864e5).toISOString(), name: n, grade: "12", section: cls, type: "unit", task: "Module 1 unit test: Quadratic Functions and Equations", correct: Math.round(pc * 0.18), total: 18, percent: pc, result: pc >= P() ? "pass" : "fail", certificate: pc >= P() && skill > 0.7 ? "Module 1 certificate" : "", weakLessons: pc >= 80 ? "" : "1-7 Quadratic Inequalities (33%); 1-5 Solving Quadratic Equations by Completing the Square (33%)", feedback: pc >= P() ? `Excellent work! You scored ${pc}% and passed.` : `You scored ${pc}%. Review Lessons 1-5 and 1-7, then try again.`, wrongQuestions: "" }); }
    });
    return out;
  }

  const notFound = () => `<div class="panel"><h2>Page not found</h2><p>This link does not match a lesson, result or certificate.</p><a class="btn" href="#/home">Go to the home page</a></div>`;

  /* ---------- router ---------- */
  function paint(html) {
    $("#app").innerHTML = html; wireQuiz(); wireActivity(); wireHome();
    const pc = $("#printCert"); if (pc) pc.onclick = () => { document.body.classList.add("print-cert"); window.print(); setTimeout(() => document.body.classList.remove("print-cert"), 500); };
    const mb = $("#markBtn"); if (mb) mb.onclick = toggleStudied;
    const nn = $("#needName"); if (nn) nn.onclick = () => askProfile(() => route());
  }
  function toggleStudied() { const id = location.hash.split("/")[2], s = studied(), i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else s.push(id); store.set("studied", s); route(); }
  function route() {
    cancelAnimationFrame(raf); raf = 0; window.onresize = null;
    const [p0, p1, p2] = (location.hash || "#/home").slice(2).split("/");
    let html;
    if (p0 === "study") html = p1 ? viewLesson(p1) : viewStudyIndex();
    else if (p0 === "practice") html = viewPractice();
    else if (p0 === "class") html = p1 ? viewClass(p1, p2) : viewClassIndex();
    else if (p0 === "quiz") html = viewQuiz(p1, p2);
    else if (p0 === "result") html = viewResult(p1);
    else if (p0 === "results") html = viewResults();
    else if (p0 === "cert") html = viewCert(p1);
    else if (p0 === "teacher") html = viewTeacher();
    else html = viewHome();
    if (p0 !== "quiz") Q = null;
    const sec = p0 === "result" || p0 === "cert" ? "results" : p0 === "quiz" ? "practice" : p0 || "home";
    $$(".nav a").forEach((a) => { const on = a.dataset.s === sec; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    paint(html);
    if (p0 === "teacher") wireTeacher();
    if (p0 !== "quiz") window.scrollTo(0, 0);
  }

  /* ---------- start ---------- */
  document.title = SETTINGS.siteTitle + " | " + SETTINGS.school;
  $("#brandSchool").textContent = SETTINGS.school;
  $("#brandTeacher").textContent = `${SETTINGS.teacher}, teacher. ${SETTINGS.principal}, principal.`;
  $("#foot").innerHTML = `${esc(SETTINGS.school)}. ${esc(SETTINGS.subject)}. ${esc(SETTINGS.book)}, ${esc(SETTINGS.term)}.<br>Teacher: ${esc(SETTINGS.teacher)}. Principal: ${esc(SETTINGS.principal)}. <a href="#/teacher">Teacher area</a>`;
  $$("img.logo").forEach((i) => i.src = LOGO);
  paintWho();
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
